<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cowork-deck</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- A copy of the app's own `index.html` body, and it has to be one: this page
         starts the same app under a different role, so every element `startApp`
         queries has to be here under the same id. Vite serves one module graph per
         page, so the two cannot share a fragment without a build step neither
         needs. Keep them in step — an element only `index.html` has is an element
         `startApp` finds null in a workspace window, and the non-null assertions
         in `app.ts` turn that into a blank window at boot rather than a warning.
         `harness/index.html` carries the same standing instruction and the same
         reason. -->
    <div id="app">
      <!-- The three screens are siblings in a row, and the switch between them
           sits above that row rather than inside the sidebar: it is navigation
           for the whole window, not a sidebar block, and in the sidebar its
           width was set by however long the workspace names were. `#stage` is
           the row; `#app` is now the column holding the bar and the row. The
           pull request screen joins the row from `main.ts`. -->
      <!-- The bar is a `header`, not the `nav` it used to be: it holds the app's
           mark and its global actions as well as the screen switch, and only the
           switch is navigation. `#viewbar` keeps its id and its `nav` — `main.ts`
           mounts the switch into it, and the test fixtures mirror it. -->
      <header class="topbar">
        <div class="mark" id="mark" data-od-id="wordmark"></div>
        <nav id="viewbar" aria-label="Screens"></nav>
        <span class="topbar-spacer"></span>
        <div id="topbar-actions"></div>
      </header>
      <div id="stage">
        <aside id="sidebar"></aside>
        <!-- The deck and the terminal drawer are one column: the drawer is a
             strip under the deck, not a fourth screen and not a floating panel.
             `#workarea` exists only to stack them, so `#deck` keeps its id, its
             `main` landmark and every selector already written against it. -->
        <div id="workarea">
          <main id="deck"></main>
          <div id="terminals"></div>
        </div>
        <div id="board" class="hidden"></div>
      </div>
    </div>
    <script type="module" src="/src/workspace.ts"></script>
  </body>
</html>
