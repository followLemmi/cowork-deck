<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- cowork-deck status-area icon — four tiles, one lit.
       The mark of `icons/icon-source.svg`, and the half of it that is the app
       rather than the terminal inside it.

       Monochrome by construction: macOS draws a template image from its alpha
       channel alone and tints it for a light menu bar, a dark one, and the
       inverted state while the panel is open. A hue here would be discarded on
       macOS and would disagree with the app icon everywhere else, so there is
       none — see docs/adr/0011.

       A template image has exactly one contrast to spend, and it goes where the
       app icon spends its accent: the top-left tile is solid and the other three
       are outlines. That is not a state signal — the icon never changes — it is
       what makes four squares read as a deck with something in it rather than as
       a window-tiling utility.

       The first draft was this icon's chevron and cursor block instead, on the
       theory that four squares would be noise at menu-bar size. In a real menu
       bar it was wrong twice over: 36 pixels is room for four 14-pixel tiles
       with a 3-pixel gutter, and the chevron alone said "a terminal", which
       every other icon up there could also say.

       Rasterised by scripts/tray-icon.mjs, which carries the same numbers and is
       the thing that runs. Editing this file does not change the PNG. -->
  <rect x="2.5" y="2.5" width="14" height="14" rx="3.5" fill="#000"/>
  <g fill="none" stroke="#000" stroke-width="2">
    <rect x="19.5" y="2.5" width="14" height="14" rx="3.5"/>
    <rect x="2.5" y="19.5" width="14" height="14" rx="3.5"/>
    <rect x="19.5" y="19.5" width="14" height="14" rx="3.5"/>
  </g>
</svg>
