[package]
name = "cowork-deck"
version = "0.5.0"
edition = "2021"
license = "MIT"
default-run = "cowork-deck"

[[bin]]
name = "cowork-deck"
path = "src/main.rs"

[[bin]]
name = "cowork_report"
path = "src/bin/cowork_report.rs"

[[bin]]
name = "cowork_task"
path = "src/bin/cowork_task.rs"

[lib]
name = "cowork_deck"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` puts the status-area icon up; `image-png` is what decodes the
# template image behind it (`Image::from_bytes`). Both are off by default.
#
# `macos-private-api` is back, and this time with a caller: the tray panel is a
# transparent window. It moves as a pair with `macOSPrivateApi` in
# `tauri.conf.json` — the build fails on a config asking for an API the crate
# was not compiled with. Whatever removes the last transparent window turns
# both off in the same commit.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-window-state = "2"
chrono = "0.4"
ulid = "3"
notify = "6"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2.5.4"

# Signals and process-session lookup for `pty.rs`. Killing what a session
# started means naming a process group and enumerating a session's members,
# and neither has a std equivalent — `Child::kill` reaches one pid.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
