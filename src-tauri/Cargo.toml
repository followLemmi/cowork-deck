[package]
name = "cowork-deck"
version = "0.1.0"
edition = "2021"
default-run = "cowork-deck"

[[bin]]
name = "cowork-deck"
path = "src/main.rs"

[[bin]]
name = "cowork_report"
path = "src/bin/cowork_report.rs"

[lib]
name = "cowork_deck"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
portable-pty = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-window-state = "2"
chrono = "0.4"
ulid = "3"
notify = "6"

[dev-dependencies]
tempfile = "3"
