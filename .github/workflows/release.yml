# Builds and publishes a release when a v* tag is pushed.
#
# Artifacts per platform land in one draft GitHub Release, together with the
# latest.json the in-app updater polls. Publishing the draft is the manual
# release gate — and what makes /releases/latest/download/latest.json start
# pointing at it.
#
# macOS bundles are ad-hoc signed (no Developer ID yet): a downloaded .dmg
# needs `xattr -cr` once, after which the updater takes over. The updater
# artifacts themselves are signed with TAURI_SIGNING_PRIVATE_KEY.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: cowork-deck ${{ github.ref_name }}
          releaseDraft: true
          args: --target ${{ matrix.target }}
          releaseBody: |
            ## Install

            **macOS** — download the `.dmg` for your architecture (`aarch64` for
            Apple Silicon, `x64` for Intel), drag the app to Applications, then
            clear the quarantine flag once:

            ```
            xattr -cr /Applications/cowork-deck.app
            ```

            **Linux** — download the `.AppImage`, `chmod +x` it and run, or
            install the `.deb`.

            The app checks this page for updates on launch and installs them
            in place; the `xattr` step is first-install only.
