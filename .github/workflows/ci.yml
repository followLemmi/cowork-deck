# Runs the tests on every pull request, and on what lands in dev and main.
#
# Until this existed the only workflow was `release.yml`, which triggers on a
# `v*` tag — so the whole suite ran only where somebody remembered to run it,
# and `dev` was a convention rather than a gate.
#
# Three things this deliberately does NOT do:
#
#   * No `cargo fmt --check`. The Rust here is hand-formatted denser than
#     rustfmt wants, throughout — adding the check would fail every run until
#     someone reformats the crate, which is a decision about the code's style
#     and not something a CI file gets to make on its own.
#   * No bundling. `tauri build` is the release workflow's job; duplicating it
#     per pull request would multiply the slowest step in the project for no
#     answer that a tag build does not already give.
#   * No `cargo clippy -- -D warnings`. The crate carries 21 warnings today;
#     turning the gate on before they are fixed would fail every run, which is
#     the same objection as `cargo fmt`. Unlike fmt, this one is meant to end —
#     see #463.
name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before the tests: a type error is the cheapest failure to read, and
      # vitest would report it as something else entirely.
      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # `scripts/contrast.mjs` exits non-zero when a pair the design system
      # claims does not actually reach its WCAG ratio. It has been in the repo,
      # exiting correctly, and called by nobody — so three green ticks could sit
      # over a contrast regression (#455). It reads styles.css and needs no
      # browser, which is why it costs a second and runs here rather than in a
      # job of its own.
      - name: Contrast
        run: npm run contrast

      # Two ADRs numbered 0010 and two numbered 0011 reached `dev` and stayed
      # there (#451), which no test could have caught and a listing makes
      # obvious. Cheap enough to sit beside the contrast gate.
      - name: ADR numbering
        run: npm run adr:check

  rust:
    # Both platforms, and not for symmetry: the terminal bugs this project has
    # shipped were platform-shaped. The Darwin tty caps a pty read at 1024 bytes
    # where Linux fills a 4096-byte buffer, which is the difference between a
    # rare glitch and one corrupted line in five — a suite that ran on Linux
    # alone would have called that fixed while macOS was still broken.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    # Named by OS family rather than by runner label, and that is load-bearing:
    # a required status check is matched by name, so `rust (ubuntu-22.04)` would
    # silently stop being required the day this matrix moves to 24.04 — the check
    # a branch ruleset waits for would be one that no longer runs, and every
    # merge would block on a tick that never arrives.
    name: rust (${{ startsWith(matrix.platform, 'ubuntu') && 'linux' || 'macos' }})
    steps:
      - uses: actions/checkout@v4

      # The crate depends on tauri, so even `cargo test` needs the webkit
      # headers. Same list as the release workflow's, minus the bundling-only
      # packages.
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/cowork-memory

      # `scripts/stage-sidecar.sh` reads the sidecar list out of
      # tauri.conf.json with node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tauri-build's build.rs refuses to run while a declared externalBin is
      # missing from disk, and it runs on any cargo build of this crate — so the
      # tests cannot compile without this. Placeholders rather than real
      # binaries: nothing under test reads the staged copies (the sidecars' own
      # code is compiled and tested by `cargo test --bins` from source), and
      # building two release binaries per run to satisfy a bundler check the
      # tests do not use would be the most expensive step in this workflow.
      - name: Seed the sidecar placeholders
        run: bash scripts/stage-sidecar.sh --seed-only

      # No target filter, and that is worth stating because both obvious
      # filters are wrong here. `--lib` reaches only `tasks` — every other
      # module (commands, pty, gh, store, the scheduler) lives in the binary
      # crate, so it covers 154 of 436 tests. `--bins` inverts the mistake and
      # drops the lib plus the two integration suites in `src-tauri/tests/`.
      # The default target set is the only one that runs all six binaries'
      # worth.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # `cowork-memory` is a separate crate with its own target directory,
      # deliberately outside any root `[workspace]` — one would move src-tauri's
      # target directory and break the staging scripts. The consequence here is
      # that the step above does not reach it: without naming it, its suite
      # never runs on a pull request, and a golden parity test that never runs
      # guards nothing.
      #
      # No model and no network at test time: the suite uses a deterministic
      # fake embedder, and the tests needing the real 470 MB model are
      # `#[ignore]`d. Building it does fetch ONNX Runtime, which is what the
      # second cache entry above is for.
      - name: Memory sidecar tests
        run: cargo test --manifest-path crates/cowork-memory/Cargo.toml
