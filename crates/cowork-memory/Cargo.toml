[package]
name = "cowork-memory"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cowork_memory"
path = "src/main.rs"

[lib]
name = "cowork_memory"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
