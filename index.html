<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cowork-deck</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- There are no screens any more. `#stage` is a row of three: the rail
           that selects what the panel holds, the panel, and the deck — and the
           deck never leaves it. What used to be four tab labels was not a
           structure but four states of one window, and the floating pill exists
           because that window could not show the deck and anything else at once.
           `#board` is a page of the panel now; `#pr` and `#history` join it there
           from `app.ts`, which is also what fills `#rail`, `#panel-head` and
           `#ledger`. -->
      <header class="topbar">
        <div class="mark" id="mark" data-od-id="wordmark"></div>
        <span class="topbar-spacer"></span>
        <!-- What replaced four tab labels. Not "where to go" but "what wants me",
             and every reading in it is a jump into the panel rather than a
             destination. Empty here on purpose: `app.ts` writes it from the deck's
             own counts, so no number in this markup can go stale. -->
        <div id="ledger" data-od-id="ledger"></div>
        <div id="topbar-actions"></div>
      </header>
      <div id="stage">
        <!-- The rail selects what the panel holds. It never changes what the
             window holds, and that is the whole difference from a tab bar. -->
        <nav id="rail" aria-label="Panels"></nav>
        <aside id="sidebar">
          <div id="panel-head"></div>
          <!-- One page shows at a time; `#board`, `#pr` and `#history` are three
               of the five, which is why the two that were full-width screens can
               ask the panel for the deck's width instead of the deck's place. -->
          <div id="panel-stack">
            <div id="board" class="panel-page hidden"></div>
          </div>
        </aside>
        <!-- The deck and the terminal drawer are one column: the drawer is a
             strip under the deck, not a fourth screen and not a floating panel.
             `#workarea` exists only to stack them, so `#deck` keeps its id, its
             `main` landmark and every selector already written against it. -->
        <div id="workarea">
          <main id="deck"></main>
          <div id="terminals"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
