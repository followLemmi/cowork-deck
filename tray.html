<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>cowork-deck</title>
  </head>
  <body>
    <!-- The window is transparent and the panel is what is drawn in it, so the
         rounded corners and the shadow belong to this element rather than to the
         window. `tray.css` explains why this page loads the app's whole
         stylesheet where `pill.html` copies a handful of colours by hand. -->
    <div id="tray">
      <div id="tray-sections"></div>
      <footer class="tray-foot">
        <button type="button" id="tray-open">Open the deck</button>
        <button type="button" id="tray-quit" class="tray-quiet">Quit</button>
      </footer>
    </div>
    <script type="module" src="/src/tray-window.ts"></script>
  </body>
</html>
